[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
command = ["fd -t f", "fd -t f -H", "fd -t f -H -I"]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"
ctrl-up = "actions:goto_parent_dir"

[actions.edit]
description = "Opens the selection in this tmux session's nvim (falls back to a new nvim)"
command = "tv-open-in-nvim '{}'"
shell = "bash"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
# Same as the text channel: `tv-restart` keeps tv.nvim's `--expect` keys alive
# across the restart so <CR> still hands the selection back to nvim.
command = "tv-restart files .."
shell = "bash"
mode = "execute"
